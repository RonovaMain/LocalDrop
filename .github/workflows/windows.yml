name: Windows Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  APP_VERSION: "0.2.2"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install "flet>=0.86.0"

      # Перетаскивание файлов из проводника работает через стороннее расширение flet-dropzone.
      # Если оно не собралось, ниже запускается сборка без него (файлы выбираются кнопками).
      - name: Add drag-and-drop extension
        run: python tools/add_dropzone.py

      - name: Build (with drag-and-drop)
        id: with_dz
        continue-on-error: true
        run: flet build windows --yes

      - name: Build (fallback without drag-and-drop)
        if: steps.with_dz.outcome == 'failure'
        run: |
          git checkout -- pyproject.toml
          flet build windows --yes

      - name: Find the app executable
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/windows -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in build/windows" }
          Write-Host "App executable: $($exe.Name)"
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 was not found after install" }

      # Windows распространяется только установщиком (один .exe), портативной версии нет.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "/DAppExe=${{ steps.exe.outputs.name }}" installer\LocalDrop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: LocalDrop-windows-installer
          path: dist/LocalDrop-Setup-*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LocalDrop-Setup-*.exe
