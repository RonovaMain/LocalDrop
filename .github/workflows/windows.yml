name: Windows Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install "flet>=0.86.0"

      # Перетаскивание файлов из проводника работает через стороннее расширение flet-dropzone.
      # Если оно не собралось, ниже запускается сборка без него (файлы выбираются кнопками).
      - name: Add drag-and-drop extension
        run: python tools/add_dropzone.py

      - name: Build (with drag-and-drop)
        id: with_dz
        continue-on-error: true
        run: flet build windows --yes --no-rich-output

      - name: Build (fallback without drag-and-drop)
        if: steps.with_dz.outcome == 'failure'
        run: |
          git checkout -- pyproject.toml
          flet build windows --yes --no-rich-output

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/* -DestinationPath LocalDrop-windows-0.1.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LocalDrop-windows
          path: LocalDrop-windows-0.1.0.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalDrop-windows-0.1.0.zip
