name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION: "0.1.0"
      BUNDLE_ID: dev.ronova.localdrop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: pip install "flet>=0.86.0"

      - name: Prepare release keystore
        id: ks
        env:
          KS_B64: ${{ secrets.LOCALDROP_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.LOCALDROP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOCALDROP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LOCALDROP_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning title=APK не подписан вашим ключом::Секреты LOCALDROP_KEYSTORE_* не заданы, сборка будет подписана debug-ключом (обновление поверх release-версии невозможно)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/localdrop-release.jks"
          echo "::add-mask::$KS_PASS"
          [ -n "$KEY_PASS" ] && echo "::add-mask::$KEY_PASS"
          {
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/localdrop-release.jks"
            echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$KS_PASS"
            echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
            echo "FLET_ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flet build apk --yes \
            --bundle-id "$BUNDLE_ID" \
            --build-version "$APP_VERSION" \
            --build-number "${{ github.run_number }}" \
            --python-version 3.13 \
            --arch arm64-v8a armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p out
          apk=$(ls build/apk/*.apk | head -n1)
          cp "$apk" "out/LocalDrop-${APP_VERSION}.apk"
          ls -lh out

      - name: Show signing certificate
        continue-on-error: true
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/sdk}}"
          tool=$(find "$sdk/build-tools" -name apksigner 2>/dev/null | sort | tail -n1)
          if [ -z "$tool" ]; then echo "apksigner не найден, проверка пропущена"; exit 0; fi
          "$tool" verify --print-certs "out/LocalDrop-${APP_VERSION}.apk" | head -n 6
          if [ "${{ steps.ks.outputs.signed }}" = "true" ] && "$tool" verify --print-certs "out/LocalDrop-${APP_VERSION}.apk" | grep -qi "Android Debug"; then
            echo "::error::Ожидался release-ключ, но APK подписан debug-ключом"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LocalDrop-apk
          path: out/*.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
