name: Linux Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages for Flutter desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Flet
        run: pip install "flet>=0.86.0"

      - name: Add drag-and-drop extension
        run: python tools/add_dropzone.py

      - name: Build (with drag-and-drop)
        id: with_dz
        continue-on-error: true
        run: flet build linux --yes

      - name: Build (fallback without drag-and-drop)
        if: steps.with_dz.outcome == 'failure'
        run: |
          git checkout -- pyproject.toml
          flet build linux --yes

      - name: Pack tar.gz
        run: tar -C build/linux -czf LocalDrop-linux-0.1.0.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: LocalDrop-linux
          path: LocalDrop-linux-0.1.0.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalDrop-linux-0.1.0.tar.gz
